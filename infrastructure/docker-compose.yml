version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - fixme_mongo_data:/data/db

  server:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/fixme
      CLIENT_URL: http://localhost:5173
      ADMIN_URL: http://localhost:5174
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production-32-chars-minimum}
      STORAGE_PROVIDER: local
      PAYMENT_PROVIDER: razorpay_sandbox
      PAYMENT_SECRET_KEY: ${PAYMENT_SECRET_KEY:-sandbox_secret}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-sandbox_webhook_secret}
      EMAIL_PROVIDER_API_KEY: ${EMAIL_PROVIDER_API_KEY:-sandbox_email_key}
    depends_on:
      - mongodb

  client:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.client
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server

  admin:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.admin
    restart: unless-stopped
    ports:
      - '5174:80'
    depends_on:
      - server

volumes:
  fixme_mongo_data:

